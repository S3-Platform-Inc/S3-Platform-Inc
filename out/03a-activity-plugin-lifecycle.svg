<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1409px" preserveAspectRatio="none" style="width:450px;height:1409px;background:#FFFFFF;" version="1.1" viewBox="0 0 450 1409" width="450px" zoomAndPan="magnify"><title>S3-Platform &#8212; Plugin Lifecycle (Activity)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="319.833" x="63.6484" y="32.9951">S3-Platform &#8212; Plugin Lifecycle (Activity)</text><ellipse cx="238.0244" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="276.125" x="99.9619" y="87.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="166.957" x="109.9619" y="108.4355">Author scaffolds new plugin</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="256.125" x="109.9619" y="122.4043">from s3-platform-plugin-template (GitHub)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="325.0918" x="75.4785" y="155.2344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="166.7402" x="85.4785" y="176.373">Author implements payload</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="305.0918" x="85.4785" y="190.3418">(subclass s3p_sdk.plugin.payloads.S3PParserBase)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="236.7852" x="119.6318" y="223.1719"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="216.7852" x="129.6318" y="244.3105">Author commits &amp; pushes to GitHub</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="231.8281" x="122.1104" y="277.1406"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="211.8281" x="132.1104" y="298.2793">Author creates release tag (vX.Y.Z)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="245.0586" x="115.4951" y="331.1094"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="225.0586" x="125.4951" y="352.248">GitHub Actions runs release workflow</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="85.127" x="195.4609" y="385.0781"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="65.127" x="205.4609" y="406.2168">Run pytest</text><polygon fill="#F1F1F1" points="207.3367,439.0469,268.7122,439.0469,280.7122,451.0469,268.7122,463.0469,207.3367,463.0469,195.3367,451.0469,207.3367,439.0469" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="61.3755" x="207.3367" y="454.855">tests pass?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="176.3284" y="448.4526">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="280.7122" y="448.4526">no</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="214.6426" x="22.2939" y="473.0469"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="77.1445" x="32.2939" y="494.1855">Build artifact</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="194.6426" x="32.2939" y="508.1543">(plugin.xml + src/&lt;name&gt;/*.py)</text><rect fill="#F1F1F1" heig