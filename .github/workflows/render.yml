name: Render diagrams

on:
  push:
    branches: [main]
    paths-ignore:
      - 'out/**'
      - 'README.md'
      - '.gitignore'
  pull_request:
    paths:
      - '*.puml'
      - 'scripts/test.sh'
      - '.github/workflows/render.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PlantUML + Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends plantuml graphviz
          plantuml -version

      - name: Test (PlantUML syntax check)
        run: bash scripts/test.sh

      - name: Render to out/ (PNG + SVG)
        run: |
          mkdir -p out
          plantuml -tpng -o "$GITHUB_WORKSPACE/out" *.puml
          plantuml -tsvg -o "$GITHUB_WORKSPACE/out" *.puml
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: diagrams
          path: out/

      - name: Commit re-rendered out/ back to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: re-render diagrams [skip ci]"
          file_pattern: "out/*"
